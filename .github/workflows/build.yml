name: Build Music Agent Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone and build music-agent
        shell: bash
        run: |
          git clone https://github.com/bauerelizabeth07139/music-agent.git app
          cd app
          npm install
          npm run build
          pip install fastapi uvicorn httpx numpy soundfile pydantic pywebview python-dotenv

      - name: Verify build output
        shell: bash
        run: |
          ls -la app/dist/
          ls -la app/server/

      - name: Create portable package
        shell: bash
        run: |
          mkdir -p music-agent-desktop
          
          # Copy server
          cp -r app/server music-agent-desktop/
          cp -r app/skills music-agent-desktop/ 2>/dev/null || true
          
          # Copy frontend build as "dist"
          cp -r app/dist music-agent-desktop/dist
          
          # Copy scripts
          cp app/launch.py music-agent-desktop/
          cp app/launch_window.py music-agent-desktop/
          cp app/requirements.txt music-agent-desktop/
          
          # Copy .env.example and create .env
          cp app/.env.example music-agent-desktop/.env.example
          cp app/.env.example music-agent-desktop/.env
          
          # Create start.bat
          cat > music-agent-desktop/start.bat << 'STARTEOF'
          @echo off
          echo ========================================
          echo   Music Agent - AI Music Workstation
          echo ========================================
          echo.
          echo Installing dependencies...
          pip install -r requirements.txt --quiet
          echo.
          echo Starting Music Agent...
          python launch_window.py
          pause
          STARTEOF
          
          # Create README
          cat > music-agent-desktop/README.md << 'READMEEOF'
          # Music Agent Desktop
          
          AI Music Workstation powered by MiMo.
          
          ## Quick Start
          1. Install Python 3.8+
          2. Run start.bat
          
          ## Configuration
          Edit .env to set your MiMo API key:
          MIMO_API_KEY=your_key_here
          READMEEOF

      - name: Create zip archive
        shell: bash
        run: |
          cd music-agent-desktop
          zip -r ../music-agent-desktop.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-agent-desktop
          path: music-agent-desktop.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Music Agent Desktop
          artifacts: "music-agent-desktop.zip"
          body: |
            ## Music Agent Desktop

            AI Music Workstation powered by MiMo.

            ### Usage
            1. Download `music-agent-desktop.zip`
            2. Extract the zip file
            3. Run `start.bat`
            4. Set your MiMo API key in `.env`
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
