name: Build Music Agent Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone music-agent repo
        run: git clone https://github.com/bauerelizabeth07139/music-agent.git app

      - name: Install Python dependencies
        run: pip install fastapi uvicorn httpx numpy soundfile pydantic pywebview python-dotenv

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Create portable package
        shell: pwsh
        run: |
          $dist = "music-agent-desktop"
          New-Item -ItemType Directory -Path $dist -Force

          # Copy server and skills
          Copy-Item "app\server" "$dist\server" -Recurse
          Copy-Item "app\skills" "$dist\skills" -Recurse -ErrorAction SilentlyContinue

          # Copy frontend build as "dist" (matches backend expectation)
          Copy-Item "app\dist" "$dist\dist" -Recurse

          # Copy config and scripts
          Copy-Item "app\.env.example" "$dist\.env.example" -ErrorAction SilentlyContinue
          Copy-Item "app\launch.py" "$dist\" -ErrorAction SilentlyContinue
          Copy-Item "app\launch_window.py" "$dist\" -ErrorAction SilentlyContinue
          Copy-Item "app\requirements.txt" "$dist\"

          # Create .env from example
          if (Test-Path "$dist\.env.example") {
            Copy-Item "$dist\.env.example" "$dist\.env"
          }

          # Create start script
          $startContent = "@echo off`r`necho ========================================`r`necho   Music Agent - AI Music Workstation`r`necho ========================================`r`necho.`r`necho Installing dependencies...`r`npip install -r requirements.txt --quiet`r`necho.`r`necho Starting Music Agent...`r`npython launch_window.py`r`npause"
          Set-Content "$dist\start.bat" $startContent -Encoding ASCII

          # Create README
          $readmeContent = "# Music Agent Desktop`n`nAI Music Workstation powered by MiMo.`n`n## Quick Start`n1. Install Python 3.8+`n2. Run start.bat`n`n## Configuration`nEdit .env to set your MiMo API key:`n```MIMO_API_KEY=your_key_here```"
          Set-Content "$dist\README.md" $readmeContent -Encoding UTF8

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path "music-agent-desktop\*" -DestinationPath "music-agent-desktop.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-agent-desktop
          path: music-agent-desktop.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Music Agent Desktop
          artifacts: "music-agent-desktop.zip"
          body: |
            ## Music Agent Desktop

            AI Music Workstation powered by MiMo.

            ### Usage
            1. Download `music-agent-desktop.zip`
            2. Extract the zip file
            3. Run `start.bat`
            4. Set your MiMo API key in `.env`
          makeLatest: true
          allowUpdates: true
          removeArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
