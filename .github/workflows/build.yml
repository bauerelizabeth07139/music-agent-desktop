name: Build Music Agent Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone music-agent
        run: git clone https://github.com/bauerelizabeth07139/music-agent.git app --depth 1

      - name: Install and build
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Install Python deps
        run: pip install -r app/requirements.txt

      - name: Verify build
        shell: pwsh
        run: |
          Test-Path "app/dist/index.html"
          Test-Path "app/server/app.py"
          Get-ChildItem "app/dist" | Select-Object Name

      - name: Package
        shell: pwsh
        run: |
          $src = "app"
          $dst = "music-agent-desktop"
          New-Item -ItemType Directory -Path $dst -Force

          Copy-Item "$src\server" "$dst\server" -Recurse
          Copy-Item "$src\dist" "$dst\dist" -Recurse
          Copy-Item "$src\launch.py" "$dst\"
          Copy-Item "$src\launch_window.py" "$dst\"
          Copy-Item "$src\requirements.txt" "$dst\"

          if (Test-Path "$src\skills") {
            Copy-Item "$src\skills" "$dst\skills" -Recurse
          }
          if (Test-Path "$src\.env.example") {
            Copy-Item "$src\.env.example" "$dst\"
          }

      - name: Create start.bat
        shell: pwsh
        run: |
          $content = "@echo off`r`necho Music Agent Desktop`r`npip install -r requirements.txt --quiet`r`npython launch_window.py`r`npause"
          Set-Content "music-agent-desktop\start.bat" $content -Encoding ASCII

      - name: Create .env
        shell: pwsh
        run: |
          if (Test-Path "music-agent-desktop\.env.example") {
            Copy-Item "music-agent-desktop\.env.example" "music-agent-desktop\.env"
          } else {
            Set-Content "music-agent-desktop\.env" "MIMO_API_KEY=your_key_here"
          }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "music-agent-desktop\*" -DestinationPath "music-agent-desktop.zip"
          Get-Item "music-agent-desktop.zip" | Select-Object Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-agent-desktop
          path: music-agent-desktop.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Music Agent Desktop
          artifacts: "music-agent-desktop.zip"
          body: "Music Agent Desktop - AI Music Workstation powered by MiMo\n\nUsage: Extract and run start.bat"
          makeLatest: true
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
